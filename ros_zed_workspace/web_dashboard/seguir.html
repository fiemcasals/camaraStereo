<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jetson ZED | Seguir persona</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <style>
        .follow-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 1rem; padding: 1rem; }
        @media (max-width: 900px) { .follow-layout { grid-template-columns: 1fr; } }
        .camera-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #02040a; }
        #cameraCanvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
        .person-list { list-style: none; padding: 0; margin: 0.5rem 0; }
        .person-list li { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            padding: 0.5rem; border: 1px solid rgba(45, 212, 191, 0.3); border-radius: 6px; margin-bottom: 0.4rem; }
        .person-list li.target { border-color: #facc15; }
        .follow-btn, .stop-btn { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; padding: 0.4rem 0.7rem;
            border-radius: 6px; cursor: pointer; background: transparent; }
        .follow-btn { color: var(--primary-neon); border: 1px solid var(--primary-neon); }
        .stop-btn { color: #f43f5e; border: 1px solid #f43f5e; width: 100%; padding: 0.7rem; font-size: 0.9rem; }
        #followStatus.lost { color: #f43f5e; }
        #followStatus.following { color: #facc15; }
    </style>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="logo">ZED<span>NAV</span></div>
            <div class="status-indicator">
                <div class="dot" id="ros-status-dot"></div>
                <span id="ros-status-text">CONECTANDO A ROS...</span>
            </div>
            <a href="index.html" style="color: var(--primary-neon); text-decoration: none; font-family: 'Orbitron', sans-serif; font-size: 0.8rem;">← Panel principal</a>
        </header>

        <main class="follow-layout">
            <section class="panel">
                <div class="panel-header">
                    <h2>CÁMARA ZED 2i — HACÉ CLIC EN UNA PERSONA PARA SEGUIRLA</h2>
                    <div class="badge">LIVE</div>
                </div>
                <div class="camera-wrap">
                    <canvas id="cameraCanvas" width="1280" height="720"></canvas>
                </div>
            </section>

            <aside class="panel">
                <div class="panel-header"><h2>MODO SEGUIMIENTO</h2></div>
                <div class="data-card">
                    <div class="data-title">ESTADO</div>
                    <div class="data-value"><span id="followStatus">inactivo</span></div>
                </div>
                <div class="data-card">
                    <div class="data-title">PERSONAS DETECTADAS</div>
                    <ul class="person-list" id="personList"></ul>
                </div>
                <button class="stop-btn" id="stopBtn">DEJAR DE SEGUIR</button>
            </aside>
        </main>
    </div>
    <script src="seguir.js"></script>
</body>
</html>
