<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD | Recuperar contraseña</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-box {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 2rem; width: 100%; max-width: 360px;
        }
        .auth-box h1 { font-family: 'Orbitron', sans-serif; color: var(--primary-neon); font-size: 1.3rem; margin-bottom: 0.5rem; }
        .hint { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem; }
        .auth-box label { display: block; font-size: 0.8rem; color: var(--text-muted); margin: 0.8rem 0 0.3rem; }
        .auth-box input {
            width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3); color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; font-size: 0.9rem;
        }
        .auth-box button {
            margin-top: 1.2rem; width: 100%; background: var(--primary-neon); color: #02040a; border: none;
            border-radius: 6px; padding: 10px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer;
        }
        .auth-links { margin-top: 1rem; font-size: 0.8rem; }
        .auth-links a { color: var(--secondary-neon); text-decoration: none; }
        #msg { margin-top: 0.8rem; font-size: 0.85rem; min-height: 1.2em; }
        #msg.ok { color: var(--primary-neon); }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>VAD &middot; Recuperar contraseña</h1>
        <p class="hint">En este demo local no hay servidor de correo real: el link de recuperación se "envía" escribiéndose en <code>web_dashboard/mail_outbox.log</code> (y se imprime en la consola del servidor), como si fuera el mail que te llegaría.</p>
        <form id="forgotForm">
            <label for="identifier">Usuario o email</label>
            <input id="identifier" name="identifier" required>
            <button type="submit">Mandar link de recuperación</button>
        </form>
        <div id="msg"></div>
        <div class="auth-links"><a href="login.html">&larr; Volver a ingresar</a></div>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            const res = await fetch('/api/forgot-password', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: document.getElementById('identifier').value })
            });
            const data = await res.json();
            msg.textContent = data.message;
            msg.className = 'ok';
        });
    </script>
</body>
</html>
