<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD | Ingresar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-box {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px;
            padding: 2rem; width: 100%; max-width: 360px;
        }
        .auth-box h1 { font-family: 'Orbitron', sans-serif; color: var(--primary-neon); font-size: 1.3rem; margin-bottom: 1.2rem; }
        .auth-box label { display: block; font-size: 0.8rem; color: var(--text-muted); margin: 0.8rem 0 0.3rem; }
        .auth-box input {
            width: 100%; padding: 8px 10px; background: rgba(0,0,0,0.3); color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; font-size: 0.9rem;
        }
        .auth-box button {
            margin-top: 1.2rem; width: 100%; background: var(--primary-neon); color: #02040a; border: none;
            border-radius: 6px; padding: 10px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer;
        }
        .auth-links { margin-top: 1rem; font-size: 0.8rem; display: flex; justify-content: space-between; }
        .auth-links a { color: var(--secondary-neon); text-decoration: none; }
        #msg { margin-top: 0.8rem; font-size: 0.85rem; min-height: 1.2em; }
        #msg.error { color: var(--danger-neon); }
        #msg.ok { color: var(--primary-neon); }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>VAD &middot; Ingresar</h1>
        <form id="loginForm">
            <label for="username">Usuario</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Ingresar</button>
        </form>
        <div id="msg"></div>
        <div class="auth-links">
            <a href="register.html">Crear cuenta</a>
            <a href="forgot_password.html">Olvidé mi contraseña</a>
            <a href="/presupuesto/">Presupuesto</a>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = ''; msg.className = '';
            const body = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            };
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = 'map_editor.html';
            } else {
                msg.textContent = data.error || 'Error al ingresar';
                msg.className = 'error';
            }
        });
    </script>
</body>
</html>
