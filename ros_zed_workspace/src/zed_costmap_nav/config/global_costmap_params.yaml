global_costmap:
  plugins:
    - {name: scan_static_layer, type: "costmap_2d::StaticLayer"}
    - {name: lane_keepout_layer, type: "costmap_prohibition_layer_namespace::CostmapProhibitionLayer"}
    # La capa learned_traversability_layer (Fase 2.3) NO va aca: un StaticLayer
    # bloquea el arranque de move_base hasta recibir su primer mapa ("Requesting
    # the map..." para siempre si nadie lo publica). Se agrega solo con
    # use_learned_traversability:=true, desde costmap_plugins_learned.yaml.
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 2.0
  publish_frequency: 1.0
  static_map: false
  rolling_window: true
  width: 10.0
  height: 10.0
  resolution: 0.05
  transform_tolerance: 1.5
  # Sin esto, costmap_2d solo publica el grid completo UNA VEZ (al arrancar, vacio)
  # y despues manda solo diffs por /costmap_updates -> cualquier suscriptor del
  # topico "costmap" (como move_base/NavfnROS o nuestro render) veia siempre el
  # mapa global vacio, aunque el local si funcionaba porque ya tenia este flag.
  always_send_full_costmap: true
