# EKF LOCAL (frame "odom") - Fase 0.4: esqueleto con una sola fuente (odometria
# de la ZED). El valor real de esto se ve cuando se suman mas fuentes: encoders
# de rueda de los ODrive (Fase 1.7) y, si el Prototipo B tiene LiDAR, tambien
# rf2o_laser_odometry (Fase 1.7). Ver "Decisiones clave" del plan de navegacion
# para el diseño completo de 4 fuentes.
#
# IMPORTANTE: este nodo (no zed_wrapper) es el que tiene que publicar la TF
# odom -> base_link de ahora en mas. Por eso en navigation.launch se apaga
# pos_tracking/publish_tf de la ZED (sino chocan dos publishers de la misma
# transformada - mismo tipo de problema que tuvimos con el costmap).

frequency: 20
sensor_timeout: 0.2
two_d_mode: true  # vehiculo terrestre: ignora z/roll/pitch, evita que el drift de altura de la ZED meta ruido
publish_tf: true

odom_frame: odom
base_link_frame: base_link
world_frame: odom

odom0: /zed/zed_node/odom
odom0_config: [true,  true,  false,
               false, false, true,
               true,  true,  false,
               false, false, true,
               false, false, false]
odom0_differential: false
odom0_relative: false

# RF-01 (Fase 1.1): IMU integrada de la ZED 2i. Solo la velocidad de giro
# (vyaw): la odometria de la ZED ya fusiona la IMU por dentro (imu_fusion en
# common.yaml del wrapper), asi que sumar orientacion o aceleracion aca seria
# contar dos veces lo mismo. El giroscopio (hasta 200 Hz) suaviza los giros
# entre frames de la camara (15 Hz).
imu0: /zed/zed_node/imu/data
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_differential: false
imu0_remove_gravitational_acceleration: true

